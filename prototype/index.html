<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BentoNutriSync Protótipo</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Roboto+Condensed:wght@400;500&display=swap"><style>body{margin:0}/* Layout: cabeçalho com logo, seletor de visão e tema; nutricionista = menu + conteúdo; paciente = moldura de celular */
:root{--bg:#F1EBDA;--surface:#FBF8EF;--line:#DDD5BF;--fg:#1B1F1A;--muted:#6B6E60;--accent:#2F5238;--mint:#BFE0CB;--warn:#B4741B;--bad:#A8402F;--on-accent:#FBF8EF;
--display:'Montserrat',system-ui,sans-serif;--body:'Roboto Condensed',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151915;--surface:#1E241D;--line:#2E372D;--fg:#EEEBDD;--muted:#9AA08F;--accent:#8FC9A3;--mint:#2C4634;--warn:#E0A44A;--bad:#E1796A;--on-accent:#12170f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151915;--surface:#1E241D;--line:#2E372D;--fg:#EEEBDD;--muted:#9AA08F;--accent:#8FC9A3;--mint:#2C4634;--warn:#E0A44A;--bad:#E1796A;--on-accent:#12170f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);padding-inline:16px;padding-block:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}h2{font-size:22px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
input[type=range]{padding:0;min-height:0;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:auto}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.04em}
.brand small{display:block;font:400 12px var(--body);letter-spacing:0;color:var(--muted)}
.logo{height:42px;width:auto;border-radius:8px}
:root[data-theme="dark"] .logo{background:#F1EBDA;padding:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#F1EBDA;padding:3px}}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:nowrap}
.seg button{all:unset;cursor:pointer;padding:8px 14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:8px;font-weight:500;text-align:center;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.tabs button:focus-visible,.chip:focus-visible,.tg:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
[hidden]{display:none!important}
.view{display:none}.view.on{display:block}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px}
.layout>*{min-width:0}.nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap}
.nav a.on{background:var(--mint);color:var(--fg);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card>small,.lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpis .card b{display:block;font:800 26px var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover,tr.row:focus-visible{background:var(--mint)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--mint);white-space:nowrap}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}.pill.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}.pill.mut{background:transparent;border:1px solid var(--line);color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;min-width:70px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}.bar.over i{background:var(--warn)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom:2px solid var(--accent);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}.gap8{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv>span:last-child{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.asym{color:var(--warn)}.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.review{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 13px var(--display);flex:none}
.fig{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,var(--mint),var(--surface));display:grid;place-items:end center;border:1px solid var(--line)}
.fig svg.p{width:60%;height:auto;max-height:92%}.fig svg.g{position:absolute;inset:0;width:100%;height:100%;color:var(--accent)}
.fig .cap{position:absolute;left:8px;bottom:6px;font-size:12px;background:var(--surface);padding:1px 8px;border-radius:999px}
.fig.wide{aspect-ratio:16/9;max-height:200px}
.sl{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:12px;border:1px solid var(--line);max-width:300px;width:100%}.sl>div{position:absolute;inset:0;display:grid;place-items:end center}.sl .a{background:linear-gradient(180deg,#d8c9a8,var(--surface))}.sl .b{background:linear-gradient(180deg,var(--mint),var(--surface))}.sl i{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}.sl svg.p{width:60%;height:auto;max-height:92%}
.tg{all:unset;box-sizing:border-box;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}.tg[aria-checked=true]{background:var(--accent)}.tg[aria-checked=true]::after{left:21px}.tg[disabled]{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:500;max-width:90vw;text-align:center}
.banner{border-radius:10px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.bad{border-color:var(--bad);color:var(--bad)}.banner.warn{border-color:var(--warn)}.banner.ok{border-color:var(--accent)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}.empty b{color:var(--fg);font:700 16px var(--display)}
.skel{display:flex;flex-direction:column;gap:10px}.skel i{display:block;height:44px;border-radius:10px;background:linear-gradient(90deg,var(--line),var(--surface),var(--line));background-size:200% 100%;animation:sh 1.1s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.skel i,.spin,.wave i{animation:none}}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,10,.55);display:grid;place-items:center;z-index:70;padding:16px}.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.wave{display:flex;gap:3px;align-items:center;height:28px}.wave i{width:4px;background:var(--bad);border-radius:2px;height:8px;animation:wv .8s infinite ease-in-out}.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}@keyframes wv{50%{height:26px}}
.rec{display:flex;align-items:center;gap:10px;border:1px solid var(--bad);border-radius:10px;padding:8px 12px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--mint);color:var(--fg)}.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}.bub small{display:block;opacity:.75;font-size:11px;margin-top:2px}
.aud{display:flex;align-items:center;gap:8px;min-width:170px}.aud .tr{flex:1;height:4px;background:rgba(127,127,127,.35);border-radius:2px;overflow:hidden}.aud .tr i{display:block;height:100%;width:0;background:currentColor}
.conv{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}.conv:hover,.conv[aria-current=true]{background:var(--mint)}
.inbox{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:12px}
.agenda{display:grid;grid-template-columns:48px repeat(6,minmax(96px,1fr));min-width:660px;font-size:12px}.agenda .h{padding:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;text-align:center;border-bottom:1px solid var(--line)}.agenda .t{padding:0 6px;color:var(--muted);height:44px;border-top:1px solid var(--line);text-align:right}.agenda .c{position:relative;height:44px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.ev{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 6px;background:var(--mint);overflow:hidden;font-size:11px;line-height:1.25;z-index:1;cursor:pointer}.ev.f{background:var(--surface);border:1px solid var(--accent)}.ev.o{background:var(--accent);color:var(--on-accent)}
.sheet{background:#fff;color:#1B1F1A;border:1px solid #ddd;border-radius:6px;padding:18px;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:12px}.sheet table{min-width:0}.sheet td,.sheet th{padding:5px 6px;color:#1B1F1A;border-color:#e5e5e5}.sheet th{color:#2F5238}
.meal{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.food{display:grid;grid-template-columns:minmax(120px,1fr) 112px 84px auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.food input{width:76px}.food>span:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}.sugg{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}.sugg button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;padding:8px 10px}.sugg button:hover,.sugg button:focus-visible{background:var(--mint)}
.sub{background:color-mix(in srgb,var(--mint) 35%,transparent);border-radius:8px;padding:8px 10px;font-size:13px}
.phone{max-width:390px;margin:auto;border:1px solid var(--line);border-radius:28px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:14px;min-height:640px}
.pv{display:flex;flex-direction:column;gap:14px;flex:1}
.pnav{display:flex;gap:2px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}.pnav button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 2px;border-radius:8px;color:var(--muted);font-size:13px}.pnav button[aria-current=true]{background:var(--mint);color:var(--fg);font-weight:500}.pnav button:focus-visible{outline:2px solid var(--accent)}
.water{display:flex;gap:6px}.water i{flex:1;height:26px;border-radius:6px;background:var(--line)}.water i.f{background:var(--accent)}
.consent{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
@media(max-width:820px){
 .layout{grid-template-columns:1fr}.nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
 .inbox{grid-template-columns:1fr}.food{grid-template-columns:1fr auto;gap:8px 10px}.food>*:first-child{grid-column:1/-1}.food>*:nth-child(3){justify-self:end}.food>*:nth-child(5){justify-self:end}
 h2{font-size:19px}.top{align-items:flex-start}.seg{max-width:100%}.seg button{padding:8px 9px;font-size:14px}.top>.gap8{width:100%;justify-content:space-between}
}

 return`<div class="grid2"><div class="card"><small>Parâmetros · ${p.sex==='F'?'feminino':'masculino'}, ${p.age} anos, ${fmt(p.w[n_(p)-1])} kg, ${p.h} cm, MLG ${fmt(mlg(p))} kg</small>
 <label style="display:block;margin-top:8px">Equação<br><select id="e1" style="width:100%" data-i="energy">${o([['mif','Mifflin-St Jeor',1],['hb','Harris-Benedict revisada'],['km','Katch-McArdle (usa MLG)'],['cu','Cunningham (usa MLG)'],['fao','FAO/OMS']])}</select></label>
 <label style="display:block;margin-top:6px">Metodologia do GET<br><select id="e0" style="width:100%" data-i="energy">${o([['fat','Fatorial: TMB × fator de atividade',1],['met','Detalhado: TMB + exercício (MET) + TEF']])}</select></label>
 <div id="e2w"><label style="display:block;margin-top:6px">Fator de atividade<br><select id="e2" style="width:100%" data-i="energy">${[[1.2,'Sedentário 1,20'],[1.375,'Levemente ativo 1,375'],[1.55,'Moderado 1,55'],[1.725,'Muito ativo 1,725'],[1.9,'Extremamente ativo 1,90']].map(x=>`<option value="${x[0]}" ${x[0]===p.fa?'selected':''}>${x[1]}</option>`).join('')}</select></label></div>
 <div id="e3w" hidden><div class="tbl"><table style="min-width:360px"><thead><tr><th>Atividade</th><th>MET</th><th>Min</th><th>Vezes/sem</th></tr></thead><tbody><tr><td>Musculação</td><td><input class="mt" data-i="energy" type="number" step=".1" value="5" style="width:64px"></td><td><input class="mm" data-i="energy" type="number" value="60" style="width:64px"></td><td><input class="mf" data-i="energy" type="number" value="4" style="width:60px"></td></tr><tr><td>Corrida</td><td><input class="mt" data-i="energy" type="number" step=".1" value="9.8" style="width:64px"></td><td><input class="mm" data-i="energy" type="number" value="40" style="width:64px"></td><td><input class="mf" data-i="energy" type="number" value="2" style="width:60px"></td></tr></tbody></table></div><label style="display:block;margin-top:6px">Efeito térmico dos alimentos (%)<br><input id="etef" type="number" value="10" min="0" max="30" style="width:90px" data-i="energy"></label><p class="note">O MET é informado por você. Esta metodologia não usa fator de atividade.</p></div>
 <label style="display:block;margin-top:6px">Estratégia<br><select id="e4" style="width:100%" data-i="energy">${[[-30,'Déficit −30%'],[-20,'Déficit −20%'],[-10,'Déficit −10%',p.id!==1],[0,'Manutenção'],[10,'Superávit +10%',p.id===1],[15,'Superávit +15%'],[20,'Superávit +20%']].map(x=>`<option value="${x[0]}" ${x[2]?'selected':''}>${x[1]}</option>`).join('')}</select></label>

 <div id="e5a" class="gap8" style="margin-top:6px"><label>P %<br><input id="mp" type="number" value="30" style="width:70px" data-i="energy"></label><label>C %<br><input id="mc" type="number" value="45" style="width:70px" data-i="energy"></label><label>G %<br><input id="mf2" type="number" value="25" style="width:70px" data-i="energy"></label></div><div id="e5b" class="gap8" style="margin-top:6px" hidden><label>Proteína g/kg<br><input id="gp" type="number" step=".1" value="2" style="width:80px" data-i="energy"></label><label>Gordura g/kg<br><input id="gf" type="number" step=".1" value=".9" style="width:80px" data-i="energy"></label><span class="note">Carboidrato = restante</span></div></div>

/* ================= cálculos ao vivo (mesmas fórmulas do motor clínico) ================= */
const I={
 psearch(el){VIEWS.patients.st.q=el.value.toLowerCase();VIEWS.patients.rows()},
 assess(){const g=id=>parseFloat($('#'+id).value),w=g('aw'),h=g('ah'),c=g('ac'),q=g('aq'),o=$('#ares');
  $$('.pr').forEach(r=>{const k=r.dataset.k,l=$$('.pl')[k],a=Math.abs(parseFloat(r.value)-parseFloat(l.value));$('#asy'+k).innerHTML=isNaN(a)?'—':`<span class="${a>=.8?'asym':''}">${fmt(a)} cm</span>`});
  if(!(w>0&&h>0&&c>0&&q>0)){o.innerHTML='<small>Resultados derivados</small><div class="banner bad" role="alert" style="margin-top:8px">Preencha peso, altura, cintura e quadril com valores válidos.</div>';return}
  const b=w/((h/100)**2);o.innerHTML='<small>Resultados derivados</small>'+kv([['IMC',fmt(b)+' kg/m² · '+bmiC(b)],['RCQ',fmt(c/q,2)],['RCEst',fmt(c/h,2)]])+'<p class="note">Classificação: OMS adultos, v1.0. Cada resultado guarda a fórmula e a versão usadas.</p>'},
 skp(){const sel=$('#skp'),p=PROT[sel.value];$('#skf').innerHTML=p[1].map(n=>`<label>${n}<br><input class="sk" type="number" step="0.1" min="0" placeholder="0,0" style="width:100%" data-i="sksum"></label>`).join('');I.sksum()},
 sksum(){const t=$$('.sk').reduce((a,b)=>a+(+b.value||0),0);$('#sks').textContent=fmt(t)+' mm'},
 dens(){const p=cur(),w=p.w[n_(p)-1],db=parseFloat($('#db').value),e=$('#eq').value,o=$('#dres');if(!(db>.9&&db<1.2)){o.innerHTML='<div class="banner bad" role="alert">Densidade fora do intervalo plausível (0,9 a 1,2).</div>';return}
  const g=e==='siri'?(4.95/db-4.5)*100:(4.57/db-4.142)*100;o.innerHTML=kv([['% gordura',fmt(g)+' %'],['Massa gorda ('+fmt(w)+' kg)',fmt(w*g/100)+' kg'],['Massa livre de gordura',fmt(w*(1-g/100))+' kg']])+`<p class="note">Equação: ${e==='siri'?'Siri (1961)':'Brožek (1963)'} · v1.0</p>`},
 energy(){const p=cur(),L=n_(p)-1,w=p.w[L],m=mlg(p),g=id=>$('#'+id),eq=g('e1').value,meth=g('e0').value,fa=+g('e2').value,st=+g('e4').value,mode=g('e5').value;
  g('e2w').hidden=meth!=='fat';g('e3w').hidden=meth!=='met';g('e5a').hidden=mode!=='pct';g('e5b').hidden=mode!=='gkg';const o=g('eres');
  if(eq==='fao'){o.innerHTML='<small>Resultado</small><div class="banner warn" style="margin-top:8px"><span><b>FAO/OMS em validação científica.</b> Os coeficientes por faixa etária serão liberados após a conferência na referência original.</span></div>';return}
  const t=eq==='mif'?10*w+6.25*p.h-5*p.age+(p.sex==='M'?5:-161):eq==='hb'?(p.sex==='M'?88.362+13.397*w+4.799*p.h-5.677*p.age:447.593+9.247*w+3.098*p.h-4.33*p.age):eq==='km'?370+21.6*m:500+22*m;
  let get,lines;if(meth==='fat'){get=t*fa;lines=[['Fator de atividade',fmt(fa,3).replace(/0$/,'')],['GET = TMB × FA',fmt(get,0)+' kcal']]}
  else{let wk=0;$$('.mt').forEach((x,i)=>{wk+=(+x.value||0)*w*((+$$('.mm')[i].value||0)/60)*(+$$('.mf')[i].value||0)});const ex=wk/7,tef=(+g('etef').value||0)/100,base=t+ex;get=base+base*tef;lines=[['Exercício (MET)',fmt(ex,0)+' kcal/dia'],['TEF ('+fmt(tef*100,0)+'%)',fmt(base*tef,0)+' kcal'],['GET',fmt(get,0)+' kcal']]}
  const vet=get*(1+st/100);let P,G,C;
  if(mode==='pct'){const a=+g('mp').value,b=+g('mc').value,c=+g('mf2').value;if(Math.abs(a+b+c-100)>.01){o.innerHTML='<small>Resultado</small><div class="banner bad" role="alert" style="margin-top:8px">Os percentuais devem somar 100% (hoje somam '+fmt(a+b+c,0)+'%).</div>';return}P=vet*a/100/4;C=vet*b/100/4;G=vet*c/100/9}
